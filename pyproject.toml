[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sitemap-cache-warmer"
dynamic = ["version"]
description = "Warm page caches (CDN, Varnish, Nginx FastCGI, LiteSpeed, WordPress cache plugins) from sitemaps with browser-like header profiles, then verify each URL is a cache HIT: hit rate, TTFB, table/JSON/CSV reports and CI exit codes."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Saizul Amin" }]
keywords = ["cache-warmer", "sitemap", "wordpress", "nginx", "varnish", "cloudflare", "page-cache", "devops"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Environment :: No Input/Output (Daemon)",
    "Intended Audience :: System Administrators",
    "Topic :: Internet :: WWW/HTTP :: Site Management",
    "Topic :: System :: Systems Administration",
    "Typing :: Typed",
]
dependencies = ["httpx>=0.25", "tomli>=2.0; python_version < '3.11'"]

[project.optional-dependencies]
brotli = ["brotli>=1.0"]
dev = ["pytest>=7.4", "ruff>=0.4", "brotli>=1.0"]

[project.urls]
Homepage = "https://github.com/saizul/sitemap-cache-warmer"
Issues = "https://github.com/saizul/sitemap-cache-warmer/issues"
Changelog = "https://github.com/saizul/sitemap-cache-warmer/blob/main/CHANGELOG.md"

[project.scripts]
sitemap-cache-warmer = "sitemap_cache_warmer.cli:main"

[tool.setuptools.dynamic]
version = { attr = "sitemap_cache_warmer._version.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sitemap_cache_warmer = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests"]
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "C4", "SIM", "RUF"]
ignore = ["SIM108", "RUF022", "RUF001"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
