name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
      - name: Ruff
        run: |
          ruff check .
          ruff format --check .

  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
      - name: Test
        run: pytest
      - name: CLI smoke test (offline)
        run: |
          sitemap-cache-warmer --version
          # Reading and filtering a local sitemap makes no requests.
          sitemap-cache-warmer urls examples/sitemap.xml --order priority --exclude /cart/ > urls.txt
          test "$(wc -l < urls.txt)" -eq 4
          test "$(head -n 1 urls.txt)" = "https://www.example.com/"
          # A second run while the lock is held must exit with code 4 before sending any request.
          set +e
          flock -n "$RUNNER_TEMP/warm.lock" sitemap-cache-warmer warm examples/sitemap.xml --lock-file "$RUNNER_TEMP/warm.lock"
          code=$?
          set -e
          test "$code" -eq 4
          python examples/library_usage.py

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t sitemap-cache-warmer:ci .
      - run: docker run --rm sitemap-cache-warmer:ci --version
      - run: >
          docker run --rm -v "$PWD/examples:/work:ro" --user "$(id -u)"
          sitemap-cache-warmer:ci urls sitemap.xml --order lastmod
